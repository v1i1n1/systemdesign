
services:
  primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  replica:
    image: postgres:16
    container_name: pg-replica
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replpass
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        chown -R postgres:postgres "$$PGDATA"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "Waiting for replication account..."
          until PGPASSWORD=replpass psql -h primary -U replicator -d postgres -c "SELECT 1" >/dev/null 2>&1; do
            sleep 2
          done
          gosu postgres pg_basebackup -h primary -p 5432 -U replicator -D "$$PGDATA" -Fp -Xs -P -R
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres
    volumes:
      - replica_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  shard_a:
    image: postgres:16
    container_name: pg-shard-a
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - shard_a_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  shard_b:
    image: postgres:16
    container_name: pg-shard-b
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - shard_b_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: python:3.12-slim
    container_name: postgres-scaling-api
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app:app --host 0.0.0.0 --port 8000"
    environment:
      PRIMARY_DSN: postgresql://appuser:apppass@primary:5432/appdb
      REPLICA_DSN: postgresql://appuser:apppass@replica:5432/appdb
      SHARD_A_DSN: postgresql://appuser:apppass@shard_a:5432/appdb
      SHARD_B_DSN: postgresql://appuser:apppass@shard_b:5432/appdb
    ports:
      - "8000:8000"
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      shard_a:
        condition: service_healthy
      shard_b:
        condition: service_healthy

volumes:
  primary_data:
  replica_data:
  shard_a_data:
  shard_b_data:
